[package]
name = "nautust"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
arrayvec = "0.7.6"
nauty-Traces-sys = { version = "0.7.0", features = ["native"] }

[dev-dependencies]
criterion = "0.5.1"
seq-macro = "0.3.5"

[[bench]]
name = "orbits"
harness = false

[[bench]]
name = "recurse"
harness = false
